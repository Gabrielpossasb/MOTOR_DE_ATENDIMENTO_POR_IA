<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador de atendimento</title>
    <link rel="stylesheet" href="/estilo.css" />
    <style>
      body {
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }

      .telefone {
        width: 100%;
        max-width: 480px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--fundo-chat);
      }

      .mensagens {
        flex: 1;
        overflow-y: auto;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .balao {
        max-width: 78%;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 14.5px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
        box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
      }

      .balao.cliente {
        align-self: flex-end;
        background: var(--balao-cliente);
        border-top-right-radius: 0;
      }

      .balao.bot {
        align-self: flex-start;
        background: var(--balao-bot);
        border-top-left-radius: 0;
      }

      .meta {
        font-size: 11px;
        color: var(--texto-fraco);
        margin-top: 4px;
        border-top: 1px solid #0000000f;
        padding-top: 4px;
      }

      /* O aviso que aparece quando o bot passa a conversa para um humano. */
      .aviso {
        align-self: center;
        background: var(--amarelo);
        border: 1px solid var(--amarelo-borda);
        color: #7a5b00;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        max-width: 90%;
        text-align: center;
      }

      /*
       * Botões de ação, no lugar onde o WhatsApp põe os botões de resposta:
       * embaixo da mensagem, largos e fáceis de tocar.
       */
      .acoes {
        align-self: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        max-width: 90%;
      }

      .acoes button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--verde-escuro);
        background: #fff;
        border: 1px solid var(--verde-escuro);
        border-radius: 18px;
        padding: 7px 16px;
        cursor: pointer;
      }

      .acoes button:hover:not(:disabled) {
        background: #e7f6ec;
      }

      .acoes button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .digitando {
        align-self: flex-start;
        color: var(--texto-fraco);
        font-size: 13px;
        font-style: italic;
        padding: 4px 10px;
      }

      .barra {
        display: flex;
        gap: 8px;
        padding: 10px;
        background: #f0f2f5;
        border-top: 1px solid var(--borda);
      }

      .barra input {
        flex: 1;
        border: 1px solid var(--borda);
        border-radius: 20px;
        padding: 10px 16px;
        font-size: 14.5px;
        outline: none;
        font-family: inherit;
      }

      .barra input:focus {
        border-color: var(--verde-claro);
      }

      .barra button {
        background: var(--verde-escuro);
        color: #fff;
        border: 0;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        font-size: 17px;
        cursor: pointer;
      }

      .barra button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="telefone">
      <div class="cabecalho">
        <div>
          <h1 id="titulo">Atendimento</h1>
          <div class="sub" id="subtitulo">simulador local</div>
        </div>
        <div class="navegacao">
          <button type="button" id="reiniciar" title="Fecha esta conversa e começa outra do zero (Ctrl+Shift+N)">
            Nova conversa
          </button>
          <a href="/agenda">Agenda</a>
          <a href="/testes">Testes</a>
          <a href="/painel">Painel</a>
        </div>
      </div>

      <div class="mensagens" id="mensagens"></div>

      <form class="barra" id="formulario">
        <input
          id="entrada"
          type="text"
          placeholder="Escreva uma mensagem"
          autocomplete="off"
          autofocus
        />
        <button type="submit" id="enviar">&#10148;</button>
      </form>
    </div>

    <script>
      // Um identificador por aba: cada aba é um "contato" diferente, o que
      // permite testar várias conversas ao mesmo tempo no mesmo tenant.
      const contatoId =
        sessionStorage.getItem('contatoId') ||
        (() => {
          const novo = 'web-' + Math.random().toString(36).slice(2, 8);
          sessionStorage.setItem('contatoId', novo);
          return novo;
        })();

      const elMensagens = document.getElementById('mensagens');
      const elEntrada = document.getElementById('entrada');
      const elEnviar = document.getElementById('enviar');
      const elFormulario = document.getElementById('formulario');
      const elReiniciar = document.getElementById('reiniciar');

      document.getElementById('subtitulo').textContent = 'contato ' + contatoId;

      function rolarParaOFim() {
        elMensagens.scrollTop = elMensagens.scrollHeight;
      }

      function adicionarBalao(texto, quem, meta) {
        const balao = document.createElement('div');
        balao.className = 'balao ' + quem;
        balao.textContent = texto;

        if (meta) {
          const rodape = document.createElement('div');
          rodape.className = 'meta';
          rodape.textContent = meta;
          balao.appendChild(rodape);
        }

        elMensagens.appendChild(balao);
        rolarParaOFim();
      }

      function adicionarAviso(texto) {
        const aviso = document.createElement('div');
        aviso.className = 'aviso';
        aviso.textContent = texto;
        elMensagens.appendChild(aviso);
        rolarParaOFim();
      }

      /**
       * Desenha as ações que o núcleo ofereceu.
       *
       * O núcleo devolve id e rótulo e não sabe que viraram botão. No WhatsApp
       * estas mesmas ações viram botões de resposta, sem nada mudar no motor.
       *
       * Só a última leva de botões fica clicável: deixar botões velhos ativos
       * no meio da conversa faria o cliente destravar algo que já estava
       * destravado.
       */
      function adicionarAcoes(acoes) {
        for (const antigo of elMensagens.querySelectorAll('.acoes')) antigo.remove();
        if (!acoes || acoes.length === 0) return;

        const caixa = document.createElement('div');
        caixa.className = 'acoes';

        for (const acao of acoes) {
          const botao = document.createElement('button');
          botao.type = 'button';
          botao.textContent = acao.rotulo;
          botao.addEventListener('click', () => executarAcao(acao.id, caixa));
          caixa.appendChild(botao);
        }

        elMensagens.appendChild(caixa);
        rolarParaOFim();
      }

      async function executarAcao(acaoId, caixa) {
        for (const botao of caixa.querySelectorAll('button')) botao.disabled = true;

        try {
          const resposta = await fetch('/api/acao', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contatoId, acaoId }),
          });
          const dados = await resposta.json();

          if (!resposta.ok) {
            adicionarAviso('Erro: ' + (dados.erro || resposta.status));
            return;
          }

          caixa.remove();
          adicionarBalao(dados.texto, 'bot');
          elEntrada.focus();
        } catch (erro) {
          adicionarAviso('Falha de rede: ' + erro.message);
          for (const botao of caixa.querySelectorAll('button')) botao.disabled = false;
        }
      }

      function formatarMeta(resposta) {
        const uso = resposta.uso;
        const fontes = resposta.fontes
          .map((f) => f.arquivo + (f.secao ? ' §' + f.secao : '') + ' (' + f.score.toFixed(2) + ')')
          .join(' · ');

        const custo = 'US$ ' + uso.custoEstimadoUsd.toFixed(6);
        const numeros = uso.latenciaMs + 'ms · ' + custo + ' · score ' + resposta.melhorScore.toFixed(3);

        return fontes ? fontes + '\n' + numeros : numeros;
      }

      /**
       * Um indicador de "digitando…" para a conversa inteira, e não um por
       * mensagem enviada.
       *
       * Desde que o servidor agrupa mensagens seguidas, três envios rápidos
       * ficam em voo ao mesmo tempo. Um indicador por envio empilharia três
       * na tela para uma resposta só.
       */
      let emVoo = 0;

      function mostrarDigitando() {
        emVoo += 1;
        if (document.querySelector('.digitando')) return;

        const digitando = document.createElement('div');
        digitando.className = 'digitando';
        digitando.textContent = 'digitando…';
        elMensagens.appendChild(digitando);
        rolarParaOFim();
      }

      function esconderDigitando() {
        emVoo = Math.max(0, emVoo - 1);
        if (emVoo === 0) document.querySelector('.digitando')?.remove();
      }

      async function enviar(texto) {
        adicionarBalao(texto, 'cliente');
        mostrarDigitando();

        try {
          const resposta = await fetch('/api/mensagem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contatoId, texto }),
          });

          const dados = await resposta.json();

          // Esta mensagem foi absorvida por uma posterior: a resposta vem na
          // requisição dela. Não desenha nada, e o indicador continua de pé.
          if (dados.agrupada) {
            esconderDigitando();
            return;
          }

          esconderDigitando();

          if (!resposta.ok) {
            adicionarAviso('Erro: ' + (dados.erro || resposta.status));
            return;
          }

          // Conversa já com um humano: o bot não manda nada. No WhatsApp isso
          // seria silêncio; aqui mostramos o estado para você enxergar.
          if (dados.aguardandoHumano) {
            adicionarAviso('Esta conversa está com um atendente. O bot não responde enquanto isso.');
            adicionarAcoes(dados.acoes);
            return;
          }

          adicionarBalao(dados.texto, 'bot', formatarMeta(dados));

          if (dados.precisaDeHumano) {
            adicionarAviso('Handoff registrado (' + dados.motivoDoHandoff + '). A equipe foi acionada.');
          }

          adicionarAcoes(dados.acoes);
        } catch (erro) {
          esconderDigitando();
          adicionarAviso('Falha de rede: ' + erro.message);
        }
      }

      elFormulario.addEventListener('submit', (evento) => {
        evento.preventDefault();
        const texto = elEntrada.value.trim();
        if (texto.length === 0) return;

        elEntrada.value = '';

        // O campo NÃO é desabilitado enquanto espera, de propósito: é isso
        // que permite mandar a segunda e a terceira mensagem do mesmo
        // raciocínio. Sem isto o agrupamento do servidor nunca teria o que
        // agrupar.
        enviar(texto);
        elEntrada.focus();
      });

      /**
       * Fecha a conversa atual e começa outra do zero, com o MESMO contato.
       *
       * Quem faz o trabalho é o backend: `closed` faz a próxima mensagem criar
       * uma conversa nova, sem histórico e sem herdar o status. Por isso este
       * botão também é a saída de uma conversa presa em handoff, quando o bot
       * ficou mudo.
       *
       * Não apaga nada: o histórico é o que alimenta o painel e a lista de
       * buracos da base. Testar de novo não pode jogar fora o que o teste
       * anterior produziu.
       */
      async function reiniciar() {
        elReiniciar.disabled = true;

        try {
          const resposta = await fetch('/api/conversa/reiniciar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contatoId }),
          });
          const dados = await resposta.json();

          if (!resposta.ok) {
            adicionarAviso('Não consegui reiniciar: ' + (dados.erro || resposta.status));
            return;
          }

          elMensagens.innerHTML = '';
          adicionarAviso(
            dados.encerrada === null
              ? 'Conversa nova. Nada a encerrar — não havia conversa em andamento.'
              : 'Conversa #' + dados.encerrada + ' encerrada. A próxima mensagem começa do zero.',
          );
        } catch (erro) {
          adicionarAviso('Falha de rede: ' + erro.message);
        } finally {
          elReiniciar.disabled = false;
          elEntrada.focus();
        }
      }

      elReiniciar.addEventListener('click', reiniciar);

      // Atalho para ir testando conversa atrás de conversa sem tirar a mão do
      // teclado. Shift no meio para não colidir com o "nova janela" do browser.
      document.addEventListener('keydown', (evento) => {
        if (evento.ctrlKey && evento.shiftKey && evento.key.toLowerCase() === 'n') {
          evento.preventDefault();
          reiniciar();
        }
      });

      fetch('/api/painel')
        .then((r) => r.json())
        .then((p) => {
          if (p.tenant) document.getElementById('titulo').textContent = p.tenant.nome;
        })
        .catch(() => {});
    </script>
  </body>
</html>
